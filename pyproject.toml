[project]
name = "deeparch"
version = "0.1.0"
description = "ИС проектирования и ревью архитектуры по корпоративному стандарту (Architecture Definition Set)"
readme = "README.md"
authors = [
    { name = "Artem Latushkin", email = "latushkin.work@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120

[tool.ruff.lint]
extend-select = ["I", "B", "RUF"]
ignore = ["RUF013",   # implicit Optional: идиома FastAPI для Header(default=None)
          "RUF001", "RUF002", "RUF003"]  # «ambiguous unicode»: проект с русскими текстами

[tool.ruff.lint.flake8-bugbear]
# Depends/Body/Header в значениях по умолчанию — документированный паттерн FastAPI
extend-immutable-calls = ["fastapi.Depends", "fastapi.Body", "fastapi.Header", "fastapi.Query"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
